        // ── 財務ダッシュボード共通ユーティリティ ──
        window._fmtAsset = function(n) {
            if (Math.abs(n) >= 1e12) return (n/1e12).toFixed(1)+'兆';
            if (Math.abs(n) >= 1e8)  return (n/1e8).toFixed(1)+'億';
            if (Math.abs(n) >= 1e4)  return (n/1e4).toFixed(0)+'万';
            return n.toLocaleString();
        };

        window._buildBlockChart = function(leftBlocks, rightBlocks, leftTitle, rightTitle) {
            const total = Math.max(
                leftBlocks.reduce((s,b)=>s+b.val,0),
                rightBlocks.reduce((s,b)=>s+b.val,0)

            const side = (blocks, title) => {

                        ${showLabel ? `<div style="font-size:9px;font-weight:700;color:#0a0a0f;text-align:center;line-height:1.2;">${b.label}</div><div style="font-size:8px;color:#0a0a0f;opacity:0.8;">¥${window._fmtAsset(b.val)}</div>` : ''}
                    </div>`;
                }).join('');
                return `<div style="display:flex;flex-direction:column;gap:0;">
                    <div style="font-size:10px;color:#94a3b8;text-align:center;margin-bottom:4px;">${title}</div>
                    <div style="display:flex;flex-direction:column;gap:2px;height:200px;">${rows}</div>
                </div>`;
            };
            return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">${side(leftBlocks,leftTitle)}${side(rightBlocks,rightTitle)}</div>`;
        };

        window._pfDashTab = 'overview';

                    let val = c.stockPrice * c.shareholders['player'];

            let propVal = 0, propCount = 0, rentInc = 0;
            ownedProperties.forEach(prop => {

                    propVal += prop.currentValue||0; propCount++;
                    let mp = globalNetworkData[prop.rk]?.districts.find(d=>d.name===prop.distName)?.properties[prop.idx];
                    if (mp) { rentInc += mp.rent*(mp.occupiedNPCSlots||0); if(mp.coffeeTenant&&mp.coffeeTenant!==1) rentInc+=mp.rent; }
                }

            let vcVal = 0;
            (vcMarket||[]).forEach(vc => { if (vc.investors&&vc.investors['player']>0) vcVal+=vc.investors['player']; });
            let depTotal = Object.values(p.deposits||{}).reduce((s,v)=>s+v,0);
            let tdTotal  = (p.termDeposits||[]).reduce((s,td)=>s+td.amount,0);
            let debtTotal= Object.values(p.bankDebts||{}).reduce((s,v)=>s+v,0);
            let totalAssets = p.cash + depTotal + tdTotal + stockVal + propVal + vcVal;
            let prevTotal = window._prevTotalAssets || totalAssets;
            window._prevTotalAssets = totalAssets;
            let assetDiff = totalAssets - prevTotal;

            // 週次収支
            let wInc  = (window.playerPreviousProfit||0) > 0 ? window.playerPreviousProfit : 0;
            let wExp  = 0;
            let wNet  = window.playerPreviousProfit||0;
            // P/L詳細
            let storeSales = p.stores.reduce((s,st)=>s+(st.sales||0),0);
            let staffCost  = p.stores.reduce((s,st)=>s+((st.staffCount||1)*50000+(st.hasManager&&st.managerData?st.managerData.baseSalary:0)),0);
            let rentCost   = p.stores.reduce((s,st)=>s+(st.rent||0),0);
            let intCost    = Math.floor(debtTotal*(p.mainBankId ? (companies.find(b=>b.id===p.mainBankId)?.loanRate||0.005) : 0.005));
            let revenue    = storeSales + rentInc + wNet*0.2; // 概算
            let netIncome  = wNet;
            let tax        = Math.max(0, Math.floor(netIncome*0.2));

            // B/S
            let bsAssets = p.cash + depTotal + tdTotal + stockVal + propVal;
            let equity   = bsAssets - debtTotal;

            const f = window._fmtAsset;
            const tab = window._pfDashTab;

            // ── タブコンテンツ ──
            let tabContent = '';

            if (tab === 'overview') {
                const bars = [

            const cMap = { 'TOKYO': 'JP', 'OSAKA': 'JP', 'USA': 'USA', 'CHINA': 'CHINA', 'UK': 'UK', 'KOREA': 'KOREA', 'AUSTRALIA': 'AUS', 'CANADA': 'CAN', 'FRANCE': 'FRA', 'GERMANY': 'GER', 'INDIA': 'IND' };

                let isOwned = currentCo && currentCo.parent === 'player';

                let traits = window.getContractTraits(companies.find(cx => cx.id === currentInsId));
                let countInCountry = p.stores.filter(s => cMap[s.regionKey] === country).length;
                let countryCost = currentInsId ? traits.cost * countInCountry : 50000 * countInCountry;
                totalInsCost += countryCost;

                let options = `<option value="">未契約 (罰金:-¥5万/店)</option>` + insCos.map(c => {
                    let t = window.getContractTraits(c);
                    return `<option value="${c.id}" ${currentInsId === c.id ? 'selected' : ''}>${c.name.replace(/\[.*?\]\s*/, '')} [${t.desc}]</option>`;

                    <div class="flex-between">
                        <span style="font-size:12px; font-weight:bold;">${country}店舗群 (${countInCountry}店)</span>
                        <b style="font-size:11px; color:var(--danger);">-¥${(countryCost / 10000).toFixed(1)}万</b>
                    </div>
                    <select onchange="changeInsurance('${country}', this.value)" style="width:100%; padding:6px; font-size:11px; border-radius:4px; margin-top:5px;">${options}</select>
                </div>`;
            }).join('');

            let infraHtml = `
            <h3 style="border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-top:30px;">🌐 グローバル・インフラ契約</h3>
            <div class="grid-3" style="margin-bottom:30px;">
                ${buildSelect('log', 'logistics', '🚚', '物流・配送網')}
                ${buildSelect('it', 'it', '💻', 'ITシステム')}
                <div style="background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:15px;">
                    <div class="flex-between" style="margin-bottom:10px;">

                </div>

            let html = container.innerHTML;

            if (rdIndex !== -1) {
                let insertPos = html.lastIndexOf('<h3', rdIndex);

        };

        window.changeInsurance = function (country, val) {
            if (!companies[0].contracts) companies[0].contracts = { insurance: {} };
            companies[0].contracts.insurance[country] = val;

        window.changeContract = function (contractKey, newCompanyId) {
            let p = companies[0];

            if (oldCompanyId !== newCompanyId) {

                if (newCo) addLog(`【契約締結】新たに ${newCo.name.replace(/\[.*?\]\s*/, '')} とインフラ契約を結びました。`, 'success', '経済');

        // 4. ターン進行時：資金をAI企業へ実際に還流させるフック

        // ⚖️ フェーズ 3：ガバナンスと「魔の四半期決算」
        // ==========================================

        // 1. 財務・方針タブの拡張（大株主・ガバナンスUIの追加）
        const originalRenderPortfolioForGov = window.renderPortfolio;
        window.renderPortfolio = function () {
            originalRenderPortfolioForGov(); // 既存の財務UIをまず描画
            let container = document.getElementById('view-company');

            let p = companies[0];

            let topShareholders = Object.keys(p.shareholders)

        <h3 style="border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-top:30px;">

        </h3>
        <p style="font-size:12px; color:var(--text-mut); margin-bottom:15px;">彼らの「親密度」が下がると、経営要求を突きつけられたり、株の投げ売り（株価暴落）を引き起こすリスクが高まります。</p>
        <div style="background:var(--card-bg); border-radius:12px; border:1px solid var(--border); overflow:hidden; margin-bottom: 30px;">
    `;

            if (topShareholders.length === 0) {
                govHtml += `<div style="padding:20px; text-align:center; color:var(--text-mut);">現在、外部の大株主はいません。（経営権は完全に安定しています）</div>`;
            } else {

                    let loyaltyColor = loyalty >= 70 ? 'var(--success)' : (loyalty >= 40 ? 'var(--warning)' : 'var(--danger)');
                    let rank = index === 0 ? '👑 筆頭株主' : `第${index + 1}位`;

                    govHtml += `
                <div class="flex-between" style="padding:15px; border-bottom:1px solid var(--border);">
                    <div>
                        <div style="font-size:11px; font-weight:bold; color:var(--primary); margin-bottom:4px;">${rank} / ${sectors[ai.sector]?.n || '不明'}</div>
                        <div style="font-size:16px; font-weight:900;">${ai.name.replace(/\[.*?\]\s*/, '')}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:18px; font-weight:900;">${sharePct}%</div>
                        <div style="font-size:12px; font-weight:bold; color:${loyaltyColor}; background:#f8fafc; padding:2px 8px; border-radius:10px; display:inline-block; margin-top:4px;">親密度: ${loyalty}</div>
                    </div>
                </div>
            `;
                });
            }
            govHtml += `</div>`;

            container.insertAdjacentHTML('beforeend', govHtml);
            if (!document.getElementById('mobile-spacer')) container.insertAdjacentHTML('beforeend', '<div id="mobile-spacer" style="height: 150px; width: 100%; display: block;"></div>');
        };

        // 2. 臨時株主総会イベント（四半期ごとの「理不尽な要求」）
        window.triggerShareholderMeeting = function () {
            let p = companies[0];
            if (!p.contracts) p.contracts = { logistics: null, it: null, insurance: {} };

            // 発言権のある大株主（5%以上保有）を取得
            let activeShareholders = Object.keys(p.shareholders)
                .filter(id => id !== 'player' && p.shareholders[id] >= p.shares * 0.05)
                .map(id => ({ id, shares: p.shareholders[id] }))

            // ── 外部株主がいない場合: プレイヤー主導の経営方針会議 ──
            if (activeShareholders.length === 0) {

                let internalChoices = [

                    { label: '💰 株主還元強化', text: '配当性向を引き上げ、株主への還元を強化する。', action: () => { p.dividendRate = Math.min(100, (p.dividendRate || 0) + 10); addLog(`【経営方針】株主還元強化を採択。配当性向が ${p.dividendRate}% になりました。`, 'success', '自社'); } },
                    { label: '🏦 財務健全化', text: '借入を圧縮し、財務体質の改善を優先する。', action: () => { p.dividendRate = Math.max(0, (p.dividendRate || 0) - 5); addLog('【経営方針】財務健全化路線を採択。余剰利益を内部留保に充てます。', 'normal', '自社'); } },
                    { label: '🔬 R&D集中投資', text: '研究開発に重点投資し、技術力向上を狙う。', action: () => { if (typeof coffeeQuality !== 'undefined') { coffeeQuality = Math.min(5, coffeeQuality + 0.1); } addLog('【経営方針】R&D集中投資を採択。品質指数が向上しました。', 'success', '自社'); } },
                ];
                let btnHtml = internalChoices.map((c, i) =>
                    `<button class="btn-outline btn-large" style="width:100%; text-align:left; padding:14px 18px; margin-bottom:8px; border-radius:10px; background:#fff; cursor:pointer;"
                        onmouseover="this.style.borderColor='var(--primary)'; this.style.background='#eff6ff';"
                        onmouseout="this.style.borderColor=''; this.style.background='#fff';"

                        <div style="font-size:12px; color:var(--text-mut); margin-top:4px; font-weight:normal;">${c.text}</div>
                    </button>`
                ).join('') + `<button class="btn-outline btn-large" style="width:100%; text-align:left; padding:14px 18px; margin-bottom:8px; border-radius:10px; background:#fff; cursor:pointer; border-color:#94a3b8; color:#64748b;"
                        onmouseover="this.style.background='#f8fafc';" onmouseout="this.style.background='#fff';"
                        onclick="window.pickInternalPolicy(-1)">
                        <b>⏭️ 今期はスキップ</b>
                        <div style="font-size:12px; color:var(--text-mut); margin-top:4px; font-weight:normal;">特別な経営方針を定めず、現状維持のまま次の四半期へ進む。</div>
                    </button>`;
                window.pickInternalPolicy = function(idx) {
                    let modal = document.getElementById('meeting-modal');
                    if (modal) modal.remove();
                    if (idx >= 0 && window._internalChoiceActions && window._internalChoiceActions[idx]) {
                        window._internalChoiceActions[idx]();
                    }
                };
                window._internalChoiceActions = internalChoices.map(c => c.action);
                modalsArea.insertAdjacentHTML('beforeend', `
                    <div id="meeting-modal" class="modal-overlay" style="z-index:100000; backdrop-filter:blur(12px); background:rgba(0,0,0,0.8);">
                        <div class="modal-content" style="max-width:480px; border-top:6px solid var(--primary); background:#0f172a; color:#fff;">
                            <div style="text-align:center; margin-bottom:20px;">
                                <div style="font-size:40px; margin-bottom:8px;">🏢</div>
                                <div style="font-size:12px; font-weight:bold; color:var(--primary); letter-spacing:2px;">四半期 経営方針会議</div>
                                <h3 style="margin:5px 0 0 0; font-size:20px;">次の四半期の経営方針を選択してください</h3>
                                <div style="font-size:12px; color:#94a3b8; margin-top:6px;">※外部株主がいないため、経営判断はすべてあなたに委ねられています</div>
                            </div>
                            <div>${btnHtml}</div>
                        </div>
                    </div>
                `);
                let mEl = document.getElementById('meeting-modal');
                if (mEl) mEl.style.display = 'flex';
                return;
            }

            // ── 外部株主がいる場合: 大株主からの動議 ──
            // トップ3の中から確率で発議者を決定（筆頭株主ほど意見を言いやすい）
            let agitatorData = activeShareholders[Math.floor(Math.random() * Math.min(3, activeShareholders.length))];
            let ai = companies.find(c => c.id === agitatorData.id);
            if (!ai) return;

            // 要求の内容を決定するAIロジック
            let demand = { type: 'dividend', val: Math.min(100, p.dividendRate + 15), text: `株主還元が足りない。配当性向を ${Math.min(100, p.dividendRate + 15)}% に引き上げろ` };

            // インフラ系企業なら「うちと契約しろ」と迫ってくる
            let aiSectorKey = ai.sector === 'log' ? 'logistics' : ai.sector;
            if (['logistics', 'it', 'insurance'].includes(aiSectorKey) && p.contracts[aiSectorKey] !== ai.id) {
                let secName = sectors[ai.sector]?.n || ai.sector;
                demand = { type: 'contract', val: aiSectorKey, text: `全店舗の「${secName}」の契約を、我が社に切り替えろ` };

            } else if (ai.personality === 'Conservative' && p.debt > 0) {
                demand = { type: 'dividend', val: Math.max(0, p.dividendRate - 10), text: `借金があるのに経営が甘い。配当を減らして返済に回せ` };

            // モーダル生成（ダークで緊迫感のあるUI）
            let modalsArea = document.getElementById('modals-area');
            let modal = document.getElementById('meeting-modal');
            if (modal) modal.remove();

            modalsArea.insertAdjacentHTML('beforeend', `
        <div id="meeting-modal" class="modal-overlay" style="z-index: 10020; backdrop-filter: blur(12px); background: rgba(0,0,0,0.85);">
            <div class="modal-content" style="max-width: 500px; border-top: 8px solid var(--danger); background: #0f172a; color: #fff; box-shadow: 0 25px 50px -12px rgba(239, 68, 68, 0.25);">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="font-size:48px; margin-bottom:10px;">⚖️</div>

                    <h3 style="margin:5px 0 0 0; font-size:24px;">大株主からの動議</h3>
                </div>
                
                <div style="background: rgba(255,255,255,0.05); padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.1);">
                    <div style="font-size:12px; color:#cbd5e1; margin-bottom:5px;">発議者: 大株主 (${((agitatorData.shares / p.shares) * 100).toFixed(1)}%保有)</div>
                    <div style="font-size:22px; font-weight:900; color:var(--warning); margin-bottom:15px;">${ai.name.replace(/\[.*?\]\s*/, '')}</div>
                    <div style="font-size:16px; font-weight:bold; line-height:1.6; padding:15px; background:#000; border-left:4px solid var(--warning); border-radius:6px;">

                    </div>

                    <button class="btn-outline" style="flex:1; border-color:#ef4444; color:#ef4444; padding:15px; border-radius:8px;" onclick="resolveMeeting('${ai.id}', '${demand.type}', '${demand.val}', false)">❌ 拒否する (親密度激減)</button>

            let _mModal = document.getElementById('meeting-modal');

        // 3. 要求への回答と「報復ロジック（株の投げ売り）」
        window.resolveMeeting = function (aiId, type, val, accepted) {
            closeModal('meeting-modal');
            let p = companies[0];
            let ai = companies.find(c => c.id === aiId);

            if (accepted) {
                ai.loyalty = Math.min(100, (ai.loyalty || 50) + 20); // 親密度回復
                if (type === 'dividend') {
                    p.dividendRate = parseInt(val);
                    addLog(`【総会】${ai.name.replace(/\[.*?\]\s*/, '')} の要求を受け入れ、配当性向を ${val}% に変更しました。`, 'warning', '政治');
                } else if (type === 'contract') {
                    p.contracts[val] = ai.id;
                    addLog(`【総会】要求により、${sectors[val].n} の契約を ${ai.name.replace(/\[.*?\]\s*/, '')} に強制変更しました。`, 'warning', '政治');
                }
            } else {
                ai.loyalty = (ai.loyalty || 50) - 30; // 拒否すると激怒
                addLog(`【総会】${ai.name.replace(/\[.*?\]\s*/, '')} の要求を突っぱねました。相手は激怒しています！`, 'alert', '政治');

                // 🚨 報復ロジック：親密度が25以下の場合、60%の確率で株を投げ売りする
                if (ai.loyalty <= 25 && Math.random() < 0.6) {
                    setTimeout(() => {
                        let dumpShares = Math.floor(p.shareholders[ai.id] * 0.5); // 保有株の半分を市場にぶん投げる
                        if (dumpShares > 0) {
                            p.shareholders[ai.id] -= dumpShares;
                            let oldPrice = p.stockPrice;
                            p.stockPrice = Math.max(10, Math.floor(p.stockPrice * 0.7)); // 株価が30%強制暴落
                            ai.cash += dumpShares * p.stockPrice; // 投売り価格でAIは現金化

                            showMarketAlert("📉 大株主による投げ売り！", "自社株の大暴落", `
                        <b style="color:var(--danger);">${ai.name.replace(/\[.*?\]\s*/, '')}</b> が総会での要求拒否に反発し、保有する自社株 <b>${dumpShares.toLocaleString()} 株</b> を市場に大量放出しました！<br><br>
                        これにより自社の株価が <b style="font-size:18px;">¥${oldPrice.toLocaleString()} ➡️ ¥${p.stockPrice.toLocaleString()}</b> に大暴落しました。<br><br>
                        市場に大量の浮動株が出回ったため、他のAI企業から敵対的TOB（買収）を狙われる危険性が極めて高まっています！
                    `, "alert");

                            if (window.stockPriceHistory) {

                }
            }

            if (document.getElementById('view-company').classList.contains('active')) renderPortfolio();
            if (document.getElementById('view-hq').classList.contains('active')) updateHQView();
        };

        // 4. ターン進行処理のパッチ（四半期ごとに総会をフック）

        // ==========================================
        // ⚔️ フェーズ 4：TOBプロセスの高度化（大株主承認 ＆ ホワイトナイト）
        // ==========================================






        // ==========================================
        // 🏛️ 専用リッチUI：大株主 投票・議決システム
        // ==========================================
        window.activeVotingQueue = [];

        // キューに溜まった議案を順番に表示するハブ関数
        window.processVotingQueue = function (onComplete) {
            if (!window.activeVotingQueue || window.activeVotingQueue.length === 0) {
                if (typeof onComplete === 'function') onComplete();
                return;
            }
            let ev = window.activeVotingQueue.shift();
            if (!ev.onVoted) ev.onVoted = () => {};
            openShareholderVotingModal(ev, () => {
                setTimeout(() => window.processVotingQueue(onComplete), 500);
            });
        };

        window.openShareholderVotingModal = function (eventData, onNext) {
            let targetCo = eventData.target;
            let proposer = eventData.proposerName;
            let title = eventData.title;
            let desc = eventData.desc;
            let isTopShareholder = !!eventData.proposals; // proposalsがある = 筆頭株主モード
            let playerStake = targetCo.shares > 0 ? (targetCo.shareholders['player'] || 0) / targetCo.shares : 0;
            let playerVotes = targetCo.shareholders['player'] || 0;

            // NPC大株主の票をシミュレーション（筆頭株主モード以外で使用）
            let totalShares = targetCo.shares;
            let npcVotesFor = 0; let npcVotesAgainst = 0;
            Object.keys(targetCo.shareholders).forEach(id => {
                if (id !== 'player') {
                    let s = targetCo.shareholders[id];
                    if (s > totalShares * 0.03) {
                        let pCo = companies.find(c => c.id === id);
                        let isFor = eventData.type === 'tob_defense'
                            ? (pCo && pCo.personality === 'Greedy' ? false : true)
                            : Math.random() > 0.4;
                        if (isFor) npcVotesFor += s; else npcVotesAgainst += s;
                    }
                }
            });
            let publicShares = totalShares - (playerVotes + npcVotesFor + npcVotesAgainst);
            npcVotesFor += Math.floor(publicShares * 0.5);
            npcVotesAgainst += Math.ceil(publicShares * 0.5);

            // ── 筆頭株主モード：議案選択UI ──────────────────────────
            if (isTopShareholder) {
                let proposals = eventData.proposals;
                let proposalBtns = proposals.map((p, i) =>
                    `<button id="proposal-btn-${i}" class="btn-outline btn-large" style="width:100%; text-align:left; padding:16px 20px; margin-bottom:10px; border-radius:10px; border:2px solid var(--border); background:#fff; cursor:pointer;"
                        onmouseover="this.style.borderColor='var(--primary)'; this.style.background='#eff6ff';"
                        onmouseout="this.style.borderColor='var(--border)'; this.style.background='#fff';">
                        <div style="font-weight:900; font-size:15px; color:var(--text-main); margin-bottom:4px;">📋 ${p.title}</div>
                        <div style="font-size:12px; color:var(--text-mut); line-height:1.5;">${p.desc}</div>
                    </button>`
                ).join('');

                let modalHtml = `
                    <div id="voting-modal" class="modal-overlay" style="display:flex; z-index:99999; background:rgba(0,0,0,0.85); backdrop-filter:blur(15px);">
                        <div class="modal-content" style="max-width:620px; padding:0; overflow:hidden; border:2px solid var(--gold); box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
                            <div style="background:linear-gradient(135deg, #1e293b, #0f172a); color:#fff; padding:25px; text-align:center; border-bottom:4px solid var(--gold);">
                                <div style="font-size:12px; color:var(--gold); font-weight:900; letter-spacing:3px; margin-bottom:5px;">👑 CONTROLLING SHAREHOLDER</div>
                                <h2 style="margin:0; font-size:22px; font-weight:900; color:#fff;">【${targetCo.name.replace(/\[.*?\]\s*/, '')}】 <span style="font-size:0.7em; color:var(--gold);">定時株主総会</span></h2>
                                <div style="font-size:13px; color:#94a3b8; margin-top:8px;">あなたは筆頭株主として、今期の経営方針を決定できます</div>
                            </div>
                            <div style="padding:25px;">
                                <div style="background:#fffbeb; border:1px solid var(--gold); border-radius:8px; padding:12px 16px; margin-bottom:20px; font-size:13px; font-weight:bold; color:#92400e;">
                                    👑 保有議決権: ${playerVotes.toLocaleString()} 票 (${(playerStake * 100).toFixed(1)}%) ── 筆頭株主権限で可決が確定します
                                </div>
                                <div style="font-size:13px; font-weight:bold; color:var(--text-mut); margin-bottom:12px;">▼ 実行する議案を選んでください</div>
                                ${proposalBtns}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modals-area').insertAdjacentHTML('beforeend', modalHtml);

                window.currentVoteCallback = typeof onNext === 'function' ? onNext : () => {};
                proposals.forEach((p, i) => {
                    let btn = document.getElementById(`proposal-btn-${i}`);
                    if (btn) btn.onclick = () => {
                        // 議案選択後、AI株主の賛否を表示してから可決
                        proposals.forEach((_, j) => {
                            let b = document.getElementById(`proposal-btn-${j}`);
                            if (b) { b.disabled = true; b.style.opacity = j === i ? '1' : '0.3'; }
                        });
                        if (btn) { btn.style.borderColor = 'var(--success)'; btn.style.background = '#f0fdf4'; }

                        // AI株主の賛否計算（筆頭株主提案なので賛成多数になりやすい）
                        let aiVoteHtml = '';
                        let aiYes = playerVotes, aiNo = 0;
                        Object.keys(targetCo.shareholders).forEach(id => {
                            if (id === 'player') return;
                            let s = targetCo.shareholders[id];
                            if (s < totalShares * 0.03) return;
                            let aiCo = companies.find(x => x.id === id);
                            let isFor = aiCo ? (Math.random() < 0.65) : true; // 筆頭株主提案は通りやすい
                            if (isFor) aiYes += s; else aiNo += s;
                            let aiName = aiCo ? aiCo.name.replace(/\[.*?\]\s*/, '') : id;
                            aiVoteHtml += `<div class="flex-between" style="padding:6px 0; border-bottom:1px solid #e2e8f0; font-size:13px;">
                                <span style="font-weight:bold;">${aiName} <span style="color:var(--text-mut); font-size:11px;">(${((s/totalShares)*100).toFixed(1)}%)</span></span>
                                <span style="font-weight:900; color:${isFor ? 'var(--success)' : 'var(--danger)'};">${isFor ? '⭕ 賛成' : '❌ 反対'}</span>

                        });
                        let total = aiYes + aiNo; let yesPct = total > 0 ? (aiYes/total)*100 : 100;

            let modalsArea = document.getElementById('modals-area');
            let modalHtml = `

                            <div style="font-size:12px; color:#94a3b8; font-weight:900; letter-spacing:3px; margin-bottom:5px;">🏛️ SHAREHOLDER MEETING</div>
                            <h2 style="margin:0; font-size:24px; font-weight:900; color:#fff;">【${targetCo.name.replace(/\[.*?\]\s*/, '')}】 <span style="font-size:0.75em; color:#94a3b8;">定時株主総会</span></h2>

                        <div style="padding:30px;">

                                <div style="font-size:13px; color:var(--text-mut); font-weight:bold; margin-bottom:8px;">📄 第1号議案 (提案者: ${proposer})</div>

            let execVote = (playerIsYes) => {
                document.getElementById('btn-vote-yes').style.display = 'none';
                document.getElementById('btn-vote-no').style.display = 'none';
                document.getElementById('voting-result-area').style.display = 'block';

                let finalYes = npcVotesFor + (playerIsYes ? playerVotes : 0);
                let finalNo = npcVotesAgainst + (!playerIsYes ? playerVotes : 0);
                let total = finalYes + finalNo;
                let yesPct = total > 0 ? (finalYes / total) * 100 : 50;

                setTimeout(() => {
                    document.getElementById('bar-yes').style.width = yesPct + '%';
                    document.getElementById('bar-no').style.width = (100 - yesPct) + '%';
                    document.getElementById('text-yes').innerText = finalYes.toLocaleString();
                    document.getElementById('text-no').innerText = finalNo.toLocaleString();

                    let isPassed = yesPct >= 50;
                    let resultTextEl = document.getElementById('voting-final-text');
                    resultTextEl.innerText = isPassed ? "⭕ 議案は【可決】されました" : "❌ 議案は【否決】されました";
                    resultTextEl.style.color = isPassed ? "var(--success)" : "var(--danger)";

                    if (typeof eventData.onVoted === 'function') eventData.onVoted(isPassed);
                }, 100);
            };

            window.currentVoteCallback = typeof onNext === 'function' ? onNext : () => {};
            eventData.callbackName = "window.currentVoteCallback";

            let yesBtn = document.getElementById('btn-vote-yes');
            let noBtn = document.getElementById('btn-vote-no');
            if (yesBtn) yesBtn.onclick = () => execVote(true);
            if (noBtn) noBtn.onclick = () => execVote(false);
        };
        // ==========================================
        // 🛠️ CEO向け：究極の修復＆神アプデ パッチ（完全版）
        // ==========================================

        // 1. TOBボタンのエラー修正 ＆ 取締役会システムの導入


        window.declareTOB = function (compId) {
            let targetId = compId || window.tradingCompanyId;
            let c = companies.find(x => x.id === targetId), p = companies[0];
            if (!c) return alert("対象企業が見つかりません。画面を開き直してください。");

            if (c.id === 'player') return;

            let premiumPrice = Math.floor(c.stockPrice * 1.3);
            let targetShares = Math.floor(c.shares * 0.51) + 1;
            let sharesToBuy = Math.max(0, targetShares - (c.shareholders['player'] || 0));

            if (sharesToBuy <= 0) {
                c.parent = 'player';
                c.name = `👑 [自社傘下] ${c.name.replace(/\[.*?\]\s*/, '')}`;
                addLog(`【買収完了】${c.name.replace(/\[.*?\]\s*/, '')} を子会社化しました！`, 'success', 'M&A');
                closeModal('trade-modal'); updateDashboard(); return;
            }

            let totalCost = premiumPrice * sharesToBuy;
            if (p.cash < totalCost) return alert(`予想買収総額（約 ¥${Math.floor(totalCost / 10000).toLocaleString()}万）に対して手元資金が不足しています。`);

            // いきなり買収せず、取締役会（承認プロセス）を開く！
            closeModal('trade-modal');
            openBoardApprovalModal(c.id, premiumPrice, sharesToBuy, totalCost);
        };

        window.openBoardApprovalModal = function (targetId, price, sharesToBuy, totalCost) {

            let totalVotes = voters.reduce((s, v) => s + v.shares, 0);
            let approveVotes = 0;
            let resultsHtml = '';

            voters.forEach(v => {
                let isPlayer = v.id === 'player';
                let ai = isPlayer ? null : companies.find(c => c.id === v.id);
                let isApprove = false; let reason = "";

                if (isPlayer) { isApprove = true; reason = "CEO提案"; }
                else {
                    let baseProb = (ai.loyalty || 50) / 100;
                    if (ai.personality === 'Conservative') { baseProb -= 0.3; reason = "「リスクが大きすぎる」"; }
                    else if (ai.personality === 'Greedy') { baseProb += 0.2; reason = "「利益拡大の好機」"; }
                    else { reason = "「戦略的価値を評価」"; }
                    if (totalCost > p.cash * 0.8) { baseProb -= 0.4; reason = "「手元資金が枯渇する」"; }
                    isApprove = Math.random() < baseProb;
                    if (!isApprove && !reason.includes("資金")) reason = "「CEOの独走は認めない」";
                }

                if (isApprove) approveVotes += v.shares;
                let name = isPlayer ? '👑 CEO (あなた)' : ai.name.replace(/\[.*?\]\s*/, '');
                let mark = isApprove ? '<span style="color:var(--success); font-weight:bold;">✅ 賛成</span>' : '<span style="color:var(--danger); font-weight:bold;">❌ 反対</span>';

                resultsHtml += `
            <div class="flex-between" style="padding:12px; border-bottom:1px solid rgba(255,255,255,0.1);">
                <div>
                    <div style="font-weight:bold;">${name} <span style="font-size:11px; color:#94a3b8;">(${((v.shares / p.shares) * 100).toFixed(1)}%)</span></div>
                    <div style="font-size:11px; color:#64748b; margin-top:4px;">${isPlayer ? '' : '理由: ' + reason}</div>
                </div>
                <div style="font-size:16px;">${mark}</div>
            </div>`;
            });

            let isPassed = approveVotes > (totalVotes / 2);
            let resultColor = isPassed ? 'var(--success)' : 'var(--danger)';
            let resultTitle = isPassed ? '決議可決 (TOB承認)' : '決議否決 (TOB棄却)';

            let modalsArea = document.getElementById('modals-area');
            let modal = document.getElementById('board-approval-modal');
            if (modal) modal.remove();

            modalsArea.insertAdjacentHTML('beforeend', `
        <div id="board-approval-modal" class="modal-overlay" style="z-index: 10030; background: rgba(0,0,0,0.9);">
            <div class="modal-content" style="max-width: 550px; background: #0f172a; color: #fff; border: 1px solid ${resultColor}; box-shadow: 0 0 30px ${isPassed ? 'rgba(16,185,129,0.3)' : 'rgba(239,68,68,0.3)'}; padding:0; overflow:hidden; display:flex; flex-direction:column; max-height:90vh;">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid rgba(255,255,255,0.1); padding:16px 20px; flex-shrink:0; position:sticky; top:0; background:#0f172a; z-index:1;">

                    <button onclick="closeModal('board-approval-modal')" style="background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:18px; width:32px; height:32px; border-radius:50%; cursor:pointer; line-height:32px; text-align:center; flex-shrink:0;">✕</button>

            document.getElementById('board-approval-modal').style.display = 'flex';

        // 2. ホワイトナイト乱入イベント
        window.triggerWhiteKnightEvent = function (eventData) {
            let t = eventData.target, k = eventData.knight;

            let modalsArea = document.getElementById('modals-area');

            if (modal) modal.remove();

            modalsArea.insertAdjacentHTML('beforeend', `
        <div id="white-knight-modal" class="modal-overlay" style="z-index: 10040; backdrop-filter: blur(10px); background: rgba(220, 38, 38, 0.4);">
            <div class="modal-content" style="max-width: 500px; border: 4px solid var(--danger); background: #0f172a; color: #fff; box-shadow: 0 0 50px rgba(239, 68, 68, 0.8);">

                    <div style="font-size:48px; margin-bottom:10px;">🚨</div>

                </div>
                <div style="background: #000; padding:20px; border-radius:12px; margin-bottom:20px; border-left: 6px solid var(--danger);">
                    <p style="font-size:14px; line-height:1.6; margin-top:0;">買収ターゲットの <b>${t.name.replace(/\[.*?\]\s*/, '')}</b> が、<br>友好関係にある <b style="color:var(--warning); font-size:16px;">${k.name.replace(/\[.*?\]\s*/, '')}</b> に<br><b style="color:var(--danger);">救済合併を要請！</b> ホワイトナイトとして対抗TOBを宣言しました。</p>
                    <div style="margin-top:15px; padding-top:15px; border-top:1px dashed #334155;">
                        <div class="flex-between" style="font-size:13px; color:#94a3b8; margin-bottom:5px;"><span>自社の提示価格</span> <span style="text-decoration:line-through;">¥${eventData.currentPrice.toLocaleString()}</span></div>
                        <div class="flex-between" style="font-size:16px; font-weight:bold;"><span>敵の提示価格</span> <span style="color:var(--danger);">¥${counterPrice.toLocaleString()}</span></div>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button class="btn-primary btn-large" style="background:var(--danger); border-radius:12px;" onclick="resolveWhiteKnight('${t.id}', '${k.id}', ${counterPrice}, true)">💰 価格を ¥${counterPrice.toLocaleString()} に引き上げて徹底抗戦する</button>
                    <button class="btn-outline btn-large" style="border-color:#64748b; color:#94a3b8; border-radius:12px;" onclick="resolveWhiteKnight('${t.id}', '${k.id}', ${counterPrice}, false)">🏳️ 買収を断念して撤退する</button>
                </div>
            </div>
        </div>`);
            document.getElementById('white-knight-modal').style.display = 'flex';
        };

        window.resolveWhiteKnight = function (targetId, knightId, counterPrice, fightBack) {
            closeModal('white-knight-modal');
            let t = companies.find(c => c.id === targetId), k = companies.find(c => c.id === knightId), p = companies[0];
            if (!t || !t.activeTOB_v2) return;

            if (fightBack) {
                let newTotalCost = counterPrice * t.activeTOB_v2.targetShares;
                if (p.cash >= newTotalCost) {
                    t.activeTOB_v2.price = counterPrice; t.stockPrice = counterPrice;
                    addLog(`【TOB攻防】価格を ¥${counterPrice.toLocaleString()} に引き上げ、${k.name.replace(/\[.*?\]\s*/, '')} を牽制しました！`, 'warning', 'M&A');
                } else {
                    alert(`手元資金が ¥${Math.floor(newTotalCost / 10000).toLocaleString()}万 に満たないため、カウンターできません！強制撤退します。`);
                    fightBack = false;
                }
            }
            if (!fightBack) {
                t.activeTOB_v2.bidder = knightId; t.activeTOB_v2.price = counterPrice; t.stockPrice = counterPrice;
                // TOB完了: ホワイトナイトが対象を買収
                t.parent = k.id;
                t.name = `[${k.name.replace(/\[.*?\]\s*/, '')}傘下] ${t.name.replace(/\[.*?\]\s*/, '')}`;
                addLog(`【買収防衛】${t.name.replace(/\[.*?\]\s*/, '')}、友好企業 ${k.name.replace(/\[.*?\]\s*/, '')} に救済合併を要請。ホワイトナイトの対抗TOBにより買収計画が阻止された。`, 'alert', 'M&A');
                showMarketAlert('🏳 ホワイトナイト成立', 'TOB決着',
                    `<b style="color:var(--warning);">${k.name.replace(/\[.*?\]\s*/, '')}</b> があなたに代わって<br>` +
                    `<b style="color:var(--warning); font-size:18px;">${t.name.replace(/\[.*?\]\s*/, '')}</b> の買収を完了しました。<br><br>` +
                    `${t.name.replace(/\[.*?\]\s*/, '')} は今後 <b>${k.name.replace(/\[.*?\]\s*/, '')}</b> の傘下企業として活動します。`, 'info');
            }
            updateDashboard(); if (document.getElementById('view-market').classList.contains('active')) updateMarket();
        };







        // 6. 家賃スライダーの復活
        window.changeRentFromPortfolio = function (rk, distName, idx, newRent, avgRent, sliderEl) {
            let r = parseInt(newRent);
            let dist = globalNetworkData[rk]?.districts.find(d => d.name === distName);
            if (dist && dist.properties[idx]) dist.properties[idx].rent = r;
            let op = ownedProperties.find(x => x.rk === rk && x.idx === idx);
            if (op) op.rent = r;
            let valEl = document.getElementById(`port-rent-val-${idx}`);
            if (valEl) valEl.innerText = `¥${(r/10000).toLocaleString()}万`;
            if (avgRent) {
                let ratio = r / avgRent;
                let lbl = ratio > 1.3 ? '🔴 高め' : ratio < 0.7 ? '🟢 安め' : '🟡 平均的';
                let clr = ratio > 1.3 ? 'var(--danger)' : ratio < 0.7 ? 'var(--success)' : 'var(--warning)';
                let msg = ratio > 1.3 ? 'が退去しやすい' : ratio < 0.7 ? 'が集まりやすい' : 'の出入りは安定';
                let hint = document.getElementById(`port-rent-hint-${idx}`);
                if (hint) { hint.innerText = `${lbl} — テナント${msg}`; hint.style.color = clr; }
            }
        };

        window.changeRent = function (regionKey, distName, propIndex, newRent, avgRent) {
            let dist = globalNetworkData[regionKey].districts.find(d => d.name === distName);
            if (dist && dist.properties[propIndex]) {
                let r = parseInt(newRent);
                dist.properties[propIndex].rent = r;
                // IDは全ての非英数字を_に変換して一致させる
                let safeKey = (regionKey + '-' + distName + '-' + propIndex).replace(/[^a-zA-Z0-9_-]/g, '_');
                let label = document.getElementById('rent-val-' + safeKey);
                if (label) label.innerText = '¥' + (r / 10000).toLocaleString() + '万';
                if (avgRent) {
                    let ratio = r / parseInt(avgRent);
                    let rentLabel = ratio > 1.3 ? '🔴 高め' : ratio < 0.7 ? '🟢 安め' : '🟡 平均的';
                    let rentColor = ratio > 1.3 ? 'var(--danger)' : ratio < 0.7 ? 'var(--success)' : 'var(--warning)';
                    let msg = ratio > 1.3 ? 'が退去しやすい' : ratio < 0.7 ? 'が集まりやすい' : 'の出入りは安定';
                    let hint = document.getElementById('rent-hint-' + safeKey);
                    if (hint) { hint.innerText = rentLabel + ' — テナント' + msg; hint.style.color = rentColor; }
                    // ラベルも更新
                    let topLabel = document.getElementById('rent-toplabel-' + safeKey);
                    if (topLabel) { topLabel.innerText = rentLabel + ' (地区平均: ¥' + Math.floor(parseInt(avgRent)/10000).toLocaleString() + '万)'; topLabel.style.color = rentColor; }
                }
            }
        };

        // 8. ランキングに「自社」と「傘下マーク」を表示
        window.renderRankingContent = function (type) {
            let validCos = companies.filter(c => !c.isBankrupt && (c.isPublic || c.id === 'player'));
            let html = '';
            if (type !== 'sector') {
                let sorted = [...validCos];
                if (type === 'marketCap') sorted.sort((a, b) => b.marketCap - a.marketCap);
                if (type === 'sales') sorted.sort((a, b) => (b.qNet || 0) - (a.qNet || 0));
                if (type === 'stores') sorted.sort((a, b) => (b.stores?.length || 0) - (a.stores?.length || 0));

                sorted = sorted.slice(0, 30);
                html = `<div style="max-height: 60vh; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; min-width: 600px;">
                <thead style="background:#f8fafc; font-size:12px; color:var(--text-mut); position:sticky; top:0; z-index:10;">
                    <tr><th style="padding:12px; text-align:left;">順位</th><th style="padding:12px; text-align:left;">企業名</th><th style="padding:12px; text-align:left;">業種</th><th style="text-align:right; padding:12px;">数値</th></tr>
                </thead><tbody>`;
                sorted.forEach((c, i) => {
                    let rankStr = i === 0 ? '🥇 1位' : i === 1 ? '🥈 2位' : i === 2 ? '🥉 3位' : `${i + 1}位`;
                    let isPlayer = c.id === 'player' ? 'background:#eff6ff; border-left: 4px solid var(--primary);' : 'border-bottom: 1px solid var(--border);';
                    let valStr = type === 'marketCap' ? '¥' + c.marketCap.toLocaleString() : type === 'sales' ? '¥' + (c.qNet || 0).toLocaleString() : (c.stores?.length || 0) + ' 店舗';
                    let nameDisp = c.id === 'player' ? '👑 自社 (あなた)' : c.name.replace(/\[.*?\]\s*/, '');
                    if (c.parent === 'player') nameDisp = '<span style="color:var(--success); font-weight:bold;">👑 [自社傘下]</span> ' + nameDisp;

                    html += `<tr style="${isPlayer} cursor:pointer; transition:0.2s;" onclick="openCompanyModal('${c.id}')">
                    <td style="padding:15px 12px; font-weight:bold; color:var(--text-mut);">${rankStr}</td>
                    <td style="padding:15px 12px; font-weight:900; font-size:15px; color:var(--text-main);">${nameDisp}</td>
                    <td style="padding:15px 12px; font-size:12px; color:var(--text-mut);">${sectors[c.sector]?.n || '不明'}</td>
                    <td style="padding:15px 12px; text-align:right; font-weight:900; color:var(--success); font-size:15px;">${valStr}</td>
                </tr>`;
                });
                html += '</tbody></table></div>';
            } else {
                window.currentRankingSector = window.currentRankingSector || 'coffee';
                let tabsHtml = `<div class="region-tabs" style="padding:15px; border-bottom:1px solid var(--border); margin:0;">`;
                Object.keys(sectors).forEach(sec => { tabsHtml += `<button class="tab-btn ${window.currentRankingSector === sec ? 'active' : ''}" onclick="window.currentRankingSector='${sec}'; renderRankingContent('sector');">${sectors[sec].n}</button>`; });
                tabsHtml += `</div>`;
                let secCos = validCos.filter(c => c.sector === window.currentRankingSector).sort((a, b) => b.marketCap - a.marketCap);
                let contentHtml = `<div style="display:flex; flex-direction:column; gap:0; max-height:50vh; overflow-y:auto;">`;
                if (secCos.length > 0) {
                    secCos.forEach((c, index) => {
                        let rankStr = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                        let isPlayer = c.id === 'player' ? 'background:#fffbeb; border-left: 4px solid var(--warning);' : 'border-bottom:1px solid var(--border);';
                        let nameDisp = c.id === 'player' ? '👑 自社' : c.name.replace(/\[.*?\]\s*/, '');
                        if (c.parent === 'player') nameDisp = '<span style="color:var(--success); font-weight:bold;">👑 [自社傘下]</span> ' + nameDisp;
                        contentHtml += `<div style="padding:15px; display:flex; justify-content:space-between; align-items:center; ${isPlayer} cursor:pointer;" onclick="openCompanyModal('${c.id}')">
                            <div style="display:flex; align-items:center; gap:15px;"><span style="font-weight:900; color:var(--text-mut); width:30px; text-align:center;">${rankStr}</span><span style="font-weight:900; font-size:16px;">${nameDisp}</span></div>
                            <div style="font-weight:900; color:var(--success); font-size:15px;">¥${c.marketCap.toLocaleString()}</div>
                        </div>`;

                    });
                } else { contentHtml += `<p style="color:var(--text-mut); text-align:center; padding: 30px; font-weight:bold;">この業種に上場企業はありません。</p>`; }
                contentHtml += `</div>`; html = tabsHtml + contentHtml;
            }
            document.getElementById('ranking-modal-content').innerHTML = html;
        };
        window.executeCompanyDilution = function (c, percent) {
            let dilutionRate = percent / 100;
            let newShares = Math.floor(c.shares * dilutionRate);
            let raisedCash = newShares * c.stockPrice;
            let oldPct = ((c.shareholders['player'] || 0) / c.shares) * 100;

            c.shares += newShares;
            c.cash += raisedCash;
            c.lastDilutionWeek = week;

            let newPct = ((c.shareholders['player'] || 0) / c.shares) * 100;

            addLog(`【公募増資】${c.name.replace(/\[.*?\]\s*/, '')}が新株を ${newShares.toLocaleString()}株 発行！市場から ¥${Math.floor(raisedCash / 10000).toLocaleString()}万 を調達しました。`, 'alert', '財務');
            if (c.shareholders['player'] > 0) {
                addLog(`【株式希薄化】増資により、あなたの持株比率が ${oldPct.toFixed(1)}% から ${newPct.toFixed(1)}% に低下しました。`, 'warning', 'M&A');
            }

            if (c.activeTOB_v2) {
                let currentBidderShares = c.shareholders[c.activeTOB_v2.bidder] || 0;
                c.activeTOB_v2.targetShares = Math.max(0, Math.floor(c.shares * 0.51) + 1 - currentBidderShares);
            }
        };
    </script>
</body>
